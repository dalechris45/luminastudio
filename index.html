<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- custom css1 -->
    <link href="./style.css" rel="stylesheet" type="text/css"/>
    <title>Lumina Studio | Pro Design</title>

</head>
<body>

<nav>
    <div class="logo">Lumina <span>Studio</span></div>
    <div style="font-size: 0.8rem; font-weight: 600; opacity: 0.5;">LATEST BUILD 7.0</div>
</nav>

<div class="wrapper">
    <div class="hero-card">
        <div class="seed-display">
            <div class="color-orb" id="orb">
                <input type="color" id="colorInput" value="#6366f1">
            </div>
            <div>
                <h1 class="hex-code" id="hexText">#6366F1</h1>
                <p style="color: #888; margin: 0;">Main System Seed</p>
            </div>
        </div>
        <div style="text-align: right; color: #888; font-size: 0.85rem;">
            Spatial Design Framework<br>Enabled for Mobile and PC
        </div>
    </div>

    <div class="grid-header">01 // Organic Mesh Gradients</div>
    <div class="gradient-mesh" id="meshGrid"></div>

    <div class="grid-header">02 // Tonal Orchestration (1-10)</div>
    <div class="system-grid" id="mainSystem"></div>
</div>

<div class="dock">
    <button class="dock-btn" id="eyeBtn">EYE DROPPER</button>
    <div style="width: 1px; height: 16px; background: rgba(255,255,255,0.2);"></div>
    <button class="dock-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">TOP</button>
</div>

<div id="toast">COPIED TO CLIPBOARD</div>




  <footer>Made with love by Kyaw San. LUMINA Studio Team.</footer>

  <!-- custom js1 -->
  <script src="./script.js"></script>


</body>
</html>
